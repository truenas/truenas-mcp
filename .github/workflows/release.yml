name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Only this job uploads the release assets.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run linters
      run: make lint

    - name: Run tests
      run: make test

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    - name: Set version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Build for macOS ARM64
      run: GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-darwin-arm64 ./cmd/truenas-mcp

    - name: Build for Windows AMD64
      run: GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-windows-amd64.exe ./cmd/truenas-mcp

    - name: Build for Linux AMD64
      run: GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-linux-amd64 ./cmd/truenas-mcp

    - name: Package binaries
      run: |
        tar -czf truenas-mcp-darwin-arm64.tar.gz truenas-mcp-darwin-arm64
        tar -czf truenas-mcp-linux-amd64.tar.gz truenas-mcp-linux-amd64
        zip truenas-mcp-windows-amd64.zip truenas-mcp-windows-amd64.exe

    - name: Generate checksums
      run: |
        sha256sum truenas-mcp-darwin-arm64.tar.gz > checksums.txt
        sha256sum truenas-mcp-linux-amd64.tar.gz >> checksums.txt
        sha256sum truenas-mcp-windows-amd64.zip >> checksums.txt

    - name: Extract release notes
      id: release_notes
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "Release $TAG_NAME" > release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Release ${{ steps.release_notes.outputs.tag_name }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          truenas-mcp-darwin-arm64.tar.gz
          truenas-mcp-linux-amd64.tar.gz
          truenas-mcp-windows-amd64.zip
          checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

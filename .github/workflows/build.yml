name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # Module and build caching is done by setup-go, keyed on go.sum.
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run linters
      run: make lint

    - name: Run tests with the race detector and coverage
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    # Non-race: several redact tests scale down under -race, so this
    # restores the full-strength randomized and linear checks.
    - name: Run full-strength redaction tests
      run: go test -count=1 ./redact

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      env:
        GOTOOLCHAIN: local

    - name: Generate coverage report
      run: |
        go tool cover -func=coverage.out -o=coverage.txt
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.txt
        retention-days: 30

    - name: Set version from git
      run: echo "VERSION=$(git describe --tags --always --dirty | sed 's/^v//')" >> $GITHUB_ENV

    - name: Build for macOS ARM64
      run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-darwin-arm64 ./cmd/truenas-mcp

    - name: Build for macOS AMD64
      run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-darwin-amd64 ./cmd/truenas-mcp

    - name: Build for Windows AMD64
      run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-windows-amd64.exe ./cmd/truenas-mcp

    - name: Build for Windows ARM64
      run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-windows-arm64.exe ./cmd/truenas-mcp

    - name: Build for Linux AMD64
      run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-linux-amd64 ./cmd/truenas-mcp

    - name: Build for Linux ARM64
      run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-linux-arm64 ./cmd/truenas-mcp

    - name: Check Linux binaries are statically linked
      run: |
        # The runner is amd64, so arm64 binaries are never executed.
        # file and readelf -l (no INTERP segment) work on any arch;
        # ldd is only reliable on the native amd64 binary.
        set -euo pipefail
        for bin in truenas-mcp-linux-amd64 truenas-mcp-linux-arm64; do
          file_out=$(file "$bin")
          echo "$file_out"
          if ! echo "$file_out" | grep -q 'statically linked'; then
            echo "error: $bin is not statically linked (file)"
            exit 1
          fi
          phdrs=$(readelf -l "$bin")
          if echo "$phdrs" | grep -q 'INTERP'; then
            echo "error: $bin has a program interpreter (readelf)"
            exit 1
          fi
        done
        if ! file truenas-mcp-linux-arm64 | grep -q 'ARM aarch64'; then
          echo "error: truenas-mcp-linux-arm64 is not an aarch64 binary"
          exit 1
        fi
        ldd_out=$(ldd truenas-mcp-linux-amd64 2>&1 || true)
        echo "$ldd_out"
        if ! echo "$ldd_out" | grep -qi 'not a dynamic executable'; then
          echo "error: truenas-mcp-linux-amd64 is not statically linked (ldd)"
          exit 1
        fi

    - name: Upload macOS ARM64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-darwin-arm64
        path: truenas-mcp-darwin-arm64
        retention-days: 30

    - name: Upload macOS AMD64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-darwin-amd64
        path: truenas-mcp-darwin-amd64
        retention-days: 30

    - name: Upload Windows AMD64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-windows-amd64
        path: truenas-mcp-windows-amd64.exe
        retention-days: 30

    - name: Upload Windows ARM64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-windows-arm64
        path: truenas-mcp-windows-arm64.exe
        retention-days: 30

    - name: Upload Linux AMD64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-linux-amd64
        path: truenas-mcp-linux-amd64
        retention-days: 30

    - name: Upload Linux ARM64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-linux-arm64
        path: truenas-mcp-linux-arm64
        retention-days: 30

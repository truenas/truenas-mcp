name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # Module and build caching is done by setup-go, keyed on go.sum.
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run linters
      run: make lint

    - name: Run tests
      run: make test

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate coverage report
      run: |
        go tool cover -func=coverage.out -o=coverage.txt
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.txt
        retention-days: 30

    - name: Set version from git
      run: echo "VERSION=$(git describe --tags --always | sed 's/^v//')" >> $GITHUB_ENV

    - name: Build for macOS ARM64
      run: GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-darwin-arm64 ./cmd/truenas-mcp

    - name: Build for Windows AMD64
      run: GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-windows-amd64.exe ./cmd/truenas-mcp

    - name: Build for Linux AMD64
      run: GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o truenas-mcp-linux-amd64 ./cmd/truenas-mcp

    - name: Upload macOS ARM64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-darwin-arm64
        path: truenas-mcp-darwin-arm64
        retention-days: 30

    - name: Upload Windows AMD64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-windows-amd64
        path: truenas-mcp-windows-amd64.exe
        retention-days: 30

    - name: Upload Linux AMD64 binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: truenas-mcp-linux-amd64
        path: truenas-mcp-linux-amd64
        retention-days: 30
